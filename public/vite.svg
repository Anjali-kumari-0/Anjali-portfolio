<!-- Save as anjali-icon-standalone.svg (works as external file) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Anjali logo">
  <defs>
    <!-- approx fallback colors -->
    <linearGradient id="grad-portfolio-fallback" x1="0" y1="0" x2="1" y2="1">
      <!-- approx purple and blue -->
      <stop offset="0%" stop-color="#7B61FF" /> <!-- approx portfolio-purple -->
      <stop offset="100%" stop-color="#4DA3FF" /> <!-- approx portfolio-blue -->
    </linearGradient>

    <linearGradient id="gloss-fallback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#grad-portfolio-fallback)" />
  <rect x="2" y="2" width="60" height="32" rx="12" fill="url(#gloss-fallback)" />

  <g transform="translate(32,36)" text-anchor="middle" dominant-baseline="middle">
    <path d="M-10 8 L-2 -12 L6 8 L2 8 L0 -2 L-2 8 Z" fill="#F8F9FF" />
    <rect x="-6" y="0" width="12" height="3" rx="1" fill="#F8F9FF"/>
  </g>

  <g transform="translate(46,16)">
    <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z" fill="#FFD166" opacity="0.95"/>
  </g>
</svg>
